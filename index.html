<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Konut Projesi · Sanal Tur</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0e11; overflow: hidden; touch-action: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0d0e11; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 16px;
      background: radial-gradient(ellipse at 50% 38%, #2a2226 0%, #131216 45%, #0d0e11 75%); color: #f2efe9; z-index: 5; text-align: center;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity .9s ease; }
    #loader.hide { opacity: 0; pointer-events: none; }
    .mark { width: 14px; height: 14px; background: #f2efe9; margin-bottom: 28px; }
    .kick { font-size: 11px; letter-spacing: .32em; color: #e2cda8; text-transform: uppercase; }
    .title { font-size: clamp(34px, 6vw, 62px); letter-spacing: .02em; font-weight: 300; margin-top: 14px; text-transform: uppercase; }
    .bar { width: min(340px, 72vw); height: 1px; background: rgba(242,239,233,.14); margin-top: 42px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: #e2cda8; transition: width .25s ease; }
    .pct { font-size: 11px; letter-spacing: .2em; color: rgba(242,239,233,.55); margin-top: 14px; font-variant-numeric: tabular-nums; }
    .note { font-size: 12px; color: rgba(242,239,233,.5); margin-top: 22px; max-width: 46ch; line-height: 1.55; }
    #warn { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); font: 13px system-ui, sans-serif; color: #f2efe9;
      background: rgba(12,13,16,.9); border: 1px solid rgba(242,239,233,.14); padding: 12px 16px; border-radius: 6px; display: none; z-index: 6; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div class="mark"></div>
    <div class="kick" id="kick">Sanal Tur</div>
    <div class="title">Konut Projesi</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="pct" id="pct">0%</div>
    <div class="note" id="note">Etkileşimli 3B tur yükleniyor. En iyi deneyim için masaüstünde güncel Chrome, Edge veya Brave önerilir.</div>
  </div>
  <div id="warn"></div>
  <script>
    var lang = (new URLSearchParams(location.search).get('lang') || (location.hash === '#en' ? 'en' : '') || document.documentElement.lang || navigator.language || 'tr').toLowerCase();
    if (lang.indexOf('en') === 0) { document.getElementById('kick').textContent = 'Virtual Tour'; document.getElementById('note').textContent = 'Loading the interactive 3D tour. For the best experience use a current Chrome, Edge or Brave on a desktop computer.'; document.title = 'Konut Projesi · Virtual Tour'; }
    var canvas = document.getElementById('unity-canvas');
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Konut Projesi",
      productName: "Konut Sanal Tur",
      productVersion: "0.1.0",
      showBanner: function (msg, type) { if (type === 'error') { var w = document.getElementById('warn'); w.textContent = msg; w.style.display = 'block'; } }
    };
    var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 1.5);

    var DATA_PARTS = 10, DATA_SIZE = 101302210, DATA_BASE = buildUrl + "/WebGL.data.unityweb.part";
    function setP(v) { v = Math.round(v * 100); document.getElementById('bar').style.width = v + '%'; document.getElementById('pct').textContent = v + '%'; }
    function loadParts() {
      var got = 0, jobs = [];
      for (var i = 0; i < DATA_PARTS; i++) (function (i) {
        jobs.push(fetch(DATA_BASE + (i < 10 ? '0' : '') + i).then(function (r) {
          if (!r.ok) throw new Error('Veri parcasi yuklenemedi: ' + i);
          var rd = r.body.getReader(), chunks = [];
          function pump() { return rd.read().then(function (x) { if (x.done) return new Blob(chunks); chunks.push(x.value); got += x.value.length; setP(0.85 * got / DATA_SIZE); return pump(); }); }
          return pump();
        }));
      })(i);
      return Promise.all(jobs).then(function (bs) { return URL.createObjectURL(new Blob(bs)); });
    }
    var script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js";
    script.onload = function () {
      loadParts().then(function (url) { config.dataUrl = url; return createUnityInstance(canvas, config, function (p) { setP(0.85 + 0.15 * p); }); }).then(function (instance) {
        window.konutTour = instance;
        setTimeout(function () { document.getElementById('loader').classList.add('hide'); }, 700);
      }).catch(function (message) { var w = document.getElementById('warn'); w.textContent = message; w.style.display = 'block'; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
